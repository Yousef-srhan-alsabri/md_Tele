<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ app_name }}</title><link rel="stylesheet" href="/static/app.css"></head><body>
<div class="shell"><header><h1>⚡ {{ app_name }}</h1><button id="logout" class="ghost hidden">تسجيل الخروج</button></header>
<section id="auth" class="card"><h2>تسجيل الدخول</h2><input id="username" placeholder="اسم المستخدم"><input id="password" type="password" placeholder="كلمة المرور"><div class="row"><button onclick="auth('login')">دخول</button>{% if registration %}<button class="secondary" onclick="auth('register')">إنشاء حساب</button>{% endif %}</div></section>
<main id="app" class="hidden"><div class="stats"><div class="card"><small>الرصيد</small><strong id="balance">0</strong></div><div class="card"><small>الحساب النشط</small><strong id="activePhone">—</strong></div><div class="card"><small>حالة المهمة</small><strong id="jobStatus">متوقفة</strong></div></div>
<div class="grid"><section class="card"><h2>حسابات Telegram</h2><div class="row"><input id="phone" placeholder="+967..."><button onclick="startTelegramLogin()">إرسال الرمز</button></div><div id="otpBox" class="hidden"><input id="otp" placeholder="رمز التحقق"><input id="twofa" type="password" placeholder="كلمة مرور التحقق بخطوتين - اختياري"><button onclick="completeTelegramLogin()">تأكيد</button></div><div id="accounts"></div></section>
<section class="card"><h2>إضافة الروابط</h2><textarea id="linksText" rows="8" placeholder="الصق روابط t.me هنا"></textarea><div class="row"><button onclick="addLinks()">حفظ الروابط</button><button class="danger" onclick="clearLinks()">مسح</button></div></section>
<section class="card"><h2>التشغيل</h2><div class="row"><button onclick="startJob()">🚀 بدء</button><button class="danger" onclick="stopJob()">إيقاف</button></div><label>الفاصل بالثواني<input id="delay" type="number" min="2"></label><label>استراحة بعد 5 نجاحات بالدقائق<input id="rest" type="number" min="0"></label><button onclick="saveSettings()">حفظ الإعدادات</button></section>
<section class="card wide"><h2>آخر الروابط</h2><div class="table-wrap"><table><thead><tr><th>الرابط</th><th>الحالة</th><th>النتيجة</th></tr></thead><tbody id="links"></tbody></table></div></section><section id="admin" class="card wide hidden"><h2>الإدارة</h2><div class="row"><input id="chargeUser" type="number" placeholder="رقم المستخدم"><input id="chargeAmount" type="number" placeholder="النقاط"><button onclick="charge()">شحن</button></div><div id="users"></div></section></div></main><div id="toast"></div></div><script>window.PUBLIC_REG={{ 'true' if registration else 'false' }};</script><script src="/static/app.js"></script></body></html>
